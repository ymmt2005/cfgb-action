name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
      - run: node --test tests/*.test.mjs
  setup:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Setup needs no content checkout or caller-configured Node/toolchain.
      - uses: ./
        id: cfgb
        with:
          cfgb-version: v0.1.0
      - name: Use the installed CLI in a subsequent step
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.cfgb.outputs.cfgb-version }}
          INSTALLED_PATH: ${{ steps.cfgb.outputs.cfgb-path }}
        run: |
          test "$INSTALLED_VERSION" = v0.1.0
          test -f "$INSTALLED_PATH"
          test "$(cfgb version)" = 'cfgb v0.1.0'
  required:
    runs-on: ubuntu-latest
    needs: [unit, setup]
    if: ${{ cancelled() || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'failure') }}
    steps:
      - run: exit 1
